<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enroll with PayU | DizitalAdda</title>
<link rel="canonical" href="https://dizitaladda.com/enroll-upay">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;width:100%;max-width:520px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.4)}
.card-header{background:linear-gradient(135deg,#14532d,#22c55e);padding:32px 36px}
.card-header h1{color:#fff;font-size:1.5rem;font-weight:800;line-height:1.3}
.card-header p{color:rgba(255,255,255,.85);font-size:.9rem;margin-top:6px}
.course-pill{display:inline-block;background:rgba(255,255,255,.18);color:#fff;font-size:.8rem;font-weight:600;padding:5px 14px;border-radius:20px;margin-top:12px;border:1px solid rgba(255,255,255,.3)}
.card-body{padding:32px 36px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:#374151;margin-bottom:6px}
.form-group label span{color:#ef4444}
.form-group input,.form-group select{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:.95rem;font-family:'Inter',sans-serif;transition:border-color .2s,box-shadow .2s;outline:none;color:#111827;background:#fff}
.form-group input:focus,.form-group select:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
.form-group input[readonly]{background:#f9fafb;color:#6b7280}
.amount-wrapper{position:relative}
.amount-wrapper .rupee{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:#374151}
.amount-wrapper input{padding-left:30px}
.btn-enroll{width:100%;padding:15px;background:linear-gradient(135deg,#166534,#22c55e);color:#fff;font-size:1rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:transform .2s,box-shadow .2s;letter-spacing:.3px;margin-top:8px}
.btn-enroll:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,197,94,.35)}
.security-note{display:flex;align-items:center;gap:8px;margin-top:16px;color:#6b7280;font-size:.8rem;justify-content:center}
.security-note svg{width:16px;height:16px;flex-shrink:0}
.back-link{display:block;text-align:center;margin-top:16px;color:#166534;font-size:.85rem;text-decoration:none;font-weight:500}
.back-link:hover{text-decoration:underline}
.error-msg{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:12px 14px;font-size:.85rem;margin-bottom:16px;line-height:1.5}
@media(max-width:540px){.card-header,.card-body{padding:24px 20px}.card-header h1{font-size:1.25rem}}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>Secure Enrollment with PayU</h1>
    <p>Fill in your details and continue to the PayU payment gateway</p>
    <span class="course-pill">Course: Selected Course</span>
  </div>
  <div class="card-body">
    
    <form method="post" action="/enroll-upay" id="upayForm">
      <div class="form-group">
        <label for="upay_name">Full Name <span>*</span></label>
        <input type="text" id="upay_name" name="name" value="" placeholder="Enter your full name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="upay_email">Email Address <span>*</span></label>
        <input type="email" id="upay_email" name="email" value="" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="upay_phone">Phone Number <span>*</span></label>
        <input type="tel" id="upay_phone" name="phone" value="" placeholder="10-digit mobile number" maxlength="10" required autocomplete="tel">
      </div>
      <div class="form-group">
        <label for="upay_course">Select Course <span>*</span></label>
                  <select id="upay_course" name="course_name" required>
            <option value="">-- Select a Course --</option>
            <optgroup label="Digital Marketing">
              <option value="Digital Marketing for Beginners">Digital Marketing for Beginners</option>
              <option value="Digital Marketing for Professionals">Digital Marketing for Professionals</option>
              <option value="Advanced Digital Marketing">Advanced Digital Marketing</option>
              <option value="Expert in Digital Marketing">Expert in Digital Marketing</option>
            </optgroup>
            <optgroup label="Cyber Security">
              <option value="Foundation in Cyber Security and Ethical Hacking">Foundation in Cyber Security and Ethical Hacking</option>
              <option value="Advanced Cyber Security and Ethical Hacking">Advanced Cyber Security and Ethical Hacking</option>
              <option value="Expert Training in Cyber Security and Ethical Hacking">Expert Training in Cyber Security and Ethical Hacking</option>
              <option value="Digital Forensic and Cyber Investigation">Digital Forensic and Cyber Investigation</option>
              <option value="Expert Training in Bug Bounty">Expert Training in Bug Bounty</option>
            </optgroup>
            <optgroup label="Generative AI">
              <option value="Diploma in Gen AI and Prompt Engineering">Diploma in Gen AI and Prompt Engineering</option>
              <option value="Advanced Gen AI and Prompt Engineering">Advanced Gen AI and Prompt Engineering</option>
              <option value="Diploma in Machine Learning and AI">Diploma in Machine Learning and AI</option>
              <option value="Advanced Machine Learning and AI">Advanced Machine Learning and AI</option>
            </optgroup>
            <optgroup label="Data Science &amp; Analytics">
              <option value="Diploma in Data Science and AI">Diploma in Data Science and AI</option>
              <option value="Advanced Data Science and AI">Advanced Data Science and AI</option>
              <option value="Diploma in Data Analytics and AI">Diploma in Data Analytics and AI</option>
              <option value="Advanced Data Analytics and AI">Advanced Data Analytics and AI</option>
              <option value="Certification in Data Analytics and AI">Certification in Data Analytics and AI</option>
            </optgroup>
            <optgroup label="Web Development">
              <option value="Web Development Course">Web Development Course</option>
              <option value="Graphic Design and Video Editing">Graphic Design and Video Editing</option>
              <option value="Graphic Design and Motion Graphics">Graphic Design and Motion Graphics</option>
            </optgroup>
          </select>
              </div>
      <div class="form-group">
        <label for="upay_amount">Fee Amount (Rs) <span>*</span></label>
        <div class="amount-wrapper">
          <span class="rupee">Rs</span>
          <input type="number" id="upay_amount" name="amount" value="" placeholder="Enter amount" min="1" max="500000" required>
        </div>
      </div>

      <button class="btn-enroll" id="upaySubmitBtn" type="submit">Continue to PayU Checkout</button>
    </form>

    <div class="security-note">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      Secure payment powered by PayU
    </div>
    <a class="back-link" href="javascript:history.back()">Go Back</a>
  </div>
</div>
<script>
document.getElementById('upayForm').addEventListener('submit', function () {
  var btn = document.getElementById('upaySubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Redirecting to PayU...';
});
</script>
</body>
</html>
