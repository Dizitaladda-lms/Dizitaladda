<style>
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  padding: 16px;
  background: rgba(10, 10, 20, 0.9); /* dark overlay */
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  z-index: 99999999;
}

/* Popup container */
.popup-content {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(320px, 360px);
  max-width: 720px;
  width: 100%;
  min-height: 460px;
  background: #111827; /* dark card */
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  color: #fff;
  position: relative;
}

/* Left image */
.popup-image {
  background: #1f2937;
  min-width: 0;
}
.popup-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;

}

/* Right form */
.popup-form {
  min-width: 0;
  padding: 32px 28px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.popup-form h2 {
  font-size: 26px;
  line-height: 1.1;
  margin-bottom: 10px;
  padding-right: 48px;
  color: #a855f7; /* purple accent */
}
.popup-form p {
  margin-bottom: 18px;
  color: #d1d5db;
}
.popup-form form {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
  width: 100%;
}
.popup-form input,
.popup-form select,
.popup-form button {
  box-sizing: border-box;
  width: 100%;
}
.popup-form input,
.popup-form select {
  padding: 12px;
  border: 1px solid #374151;
  border-radius: 8px;
  background: #1f2937;
  color: #fff;
}
.popup-form input::placeholder {
  color: #9ca3af;
}
.popup-status {
  min-height: 20px;
  font-size: 14px;
  color: #d1d5db;
}
.popup-status.is-error {
  color: #fca5a5;
}
.popup-status.is-success {
  color: #86efac;
}
.popup-form button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #7e22ce, #9333ea);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition:   transform 0.2s, background 0.3s;
}

.popup-form button:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #9333ea, #a855f7);
}
.popup-form button:disabled {
  cursor: not-allowed;
  opacity: 0.7;
  transform: none;
}

/* Close button */
.close {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 32px;
  color: #fff;
  cursor: pointer;
  line-height: 1;
  z-index: 2;
}

/* Responsive */
@media (max-width: 768px) {
  .popup {
    padding: 12px;
  }
  .popup-content{
    grid-template-columns: 1fr;
    width: min(360px, calc(100vw - 24px));
    min-height: 0;
  }

.popup-image {
  display: none;
}

/* Right form */
.popup-form {
  padding: 24px 20px 22px;
  display: flex;
  flex-direction: column;
}

.popup-form h2 {
  font-size: 22px;
  padding-right: 40px;
}

.close {
  top: 14px;
  right: 14px;
  font-size: 28px;
}
}
.hidden {
  display: none;
}

</style>
<div id="courseInfoPopup" class="popup hidden">
  <div class="popup-content">
    <!-- Left: Image -->
    <div class="popup-image">
      <!-- Speed: this photo now loads only when the popup opens (it was 169 KB on every page load) -->
      <img src="https://dizitaladda.com/pexels-rdne-7821934.jpg" alt="Students learning digital marketing at DizitalAdda" width="360" height="460" loading="lazy" decoding="async" />
    </div>

    <!-- Right: Form -->
    <div class="popup-form">
      <span id="courseInfoPopupClose" class="close">&times;</span>
      <h2>Get Course Information</h2>
      <p>Fill out the form to receive our brochure and details.</p>

      <form method="POST" id="courseInfoPopupForm" novalidate data-static-lead-bound="1">
              <input type="text" name="Name" placeholder="Enter Your Name..." autocomplete="name">
              <input type="tel" name="Number" placeholder="Enter Your Number..." autocomplete="tel" required>
              <input type="email" name="Email" placeholder="Enter Your Email..." autocomplete="email" required>
        <select name="Course" required>
          <option value="">Select Courses</option>
          <option value="Digital Marketing">Digital Marketing</option>
          <option value="Generative AI">Generative AI</option>
          <option value="Machine Learning">Machine Learning</option>
          <option value="Data Analytics">Data Analytics</option>
          <option value="Data Science">Data Science</option>
          <option value="Cyber Security">Cyber Security and Ethical Hacking</option>
        </select>
        <div id="courseInfoPopupStatus" class="popup-status" aria-live="polite"></div>
        <button type="submit">Enquire Now</button>
      </form>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const popup = document.getElementById('courseInfoPopup');
  const enquiryForm = document.getElementById('courseInfoPopupForm');
  const closePopup = document.getElementById('courseInfoPopupClose');
  const statusEl = document.getElementById('courseInfoPopupStatus');

  if (!popup || !enquiryForm || !closePopup) {
    return;
  }

  const setStatus = (message, type = '') => {
    if (!statusEl) {
      return;
    }
    statusEl.textContent = message;
    statusEl.className = 'popup-status';
    if (type) {
      statusEl.classList.add(type);
    }
  };

  const showPopup = () => popup.classList.remove('hidden');
  const hidePopup = () => popup.classList.add('hidden');

  const notifyBrowser = (title, body) => {
    if (typeof window.showBrowserNotification === 'function') {
      window.showBrowserNotification(title, body);
      return;
    }

    if (!('Notification' in window)) {
      return;
    }

    const fire = () => new Notification(title, { body, icon: '/assets/img/logo.png' });

    if (Notification.permission === 'granted') {
      fire();
    } else if (Notification.permission !== 'denied') {
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          fire();
        }
      });
    }
  };

  const getTimestamp = () => new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

  if (!sessionStorage.getItem('popupShown')) {
      setTimeout(() => {
        showPopup();
        sessionStorage.setItem('popupShown', 'true');
      }, 30000);
  }

  const scriptURL = '/api/forms/book-demo';

  enquiryForm.addEventListener('submit', function (e) {
    e.preventDefault();

    const form = new FormData(this);
    const phone = String(form.get('Number') || '').replace(/\D/g, '');

    if (!this.checkValidity()) {
      this.reportValidity();
      return;
    }

    if (phone.length < 10) {
      setStatus('Please enter a valid phone number.', 'is-error');
      return;
    }

    const payload = {
      sheet: 'Locations Hero Form',
      timestamp: getTimestamp(),
      name: String(form.get('Name') || '').trim(),
      phone: String(form.get('Number') || '').trim(),
      email: String(form.get('Email') || '').trim(),
      course: String(form.get('Course') || '').trim(),
      mode: '',
      date: '',
      message: '',
      source: window.location.href
    };

    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    setStatus('');

    fetch(scriptURL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    })
      .then(() => {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: 'popup_form_submitted',
          form_name: 'popup_enquiry',
          selected_course: payload.course
        });

        setStatus('Thank you! We will contact you shortly.', 'is-success');
        notifyBrowser('AI Submitted', 'Popup enquiry submitted successfully.');
        alert("Thanks! We'll send you the brochure.");
        enquiryForm.reset();
        hidePopup();
      })
      .catch(error => {
        console.error("Submission failed:", error);
        setStatus('Error submitting form. Please try again.', 'is-error');
        alert("Error submitting form. Please try again.");
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enquire Now';
      });
  });

  // Close popup
  closePopup.addEventListener('click', (e) => {
    e.preventDefault();
    hidePopup();
  });
});

</script>
