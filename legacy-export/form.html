<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Inquiry Form</title>
<!-- Bootstrap 5.2 CSS and Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css">

<!--noindex teg-->
<meta name="robots" content="noindex">

<style>
  .inquiry-form-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 320px;
    max-width: 100%;
    z-index: 1000;
    display: none;
    background: #fff;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    overflow: hidden;
  }
  .form-toggle {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 50%;
    padding: 10px 15px;
    cursor: pointer;
    z-index: 1001;
  }
  .inquiry-form-header {
    background: #007bff;
    color: #fff;
    padding: 10px;
    text-align: center;
  }
  /* Transition for icon */
  #toggleIcon {
    transition: transform 0.3s ease;
  }
</style>
</head>
<body>
<!-- Form Toggle Button -->
<button id="formToggle" class="form-toggle">
  <i class="bi bi-chat-square-text" id="toggleIcon"></i>
</button>

<!-- Inquiry Form -->
<div id="inquiryForm" class="inquiry-form-container">
  <div class="inquiry-form-header">Enquiry Form</div>
  <div class="p-3">
    <form id="dynamicForm" name="dynamicForm">
      <div class="mb-3">
        <input type="text" class="form-control" id="name" name="name" placeholder="Your Name" required>
      </div>
      <div class="mb-3">
        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Your Phone" required>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" id="email" name="email" placeholder="Your Email" required>
      </div>
      <div class="mb-3">
        <select class="form-select" id="course" name="course" required>
          <option value="" disabled selected>Select Course</option>
          <option value="Digital-Marketing-for-Professional">Digital Marketing for Professional</option>
          <option value="Expert-in-digital-marketing">Expert in digital marketing</option>
          <option value="Advance-digital-marketing">Advance digital marketing</option>
          <option value="Graphic-design-&-professional-Video-Editing">Graphic design &amp; professional Video Editing</option>
          <option value="Graphic-design-and-Motion-Graphics">Graphic design and Motion Graphics</option>
          <option value="Web-Development-Course">Web Development Course</option>
          <option value="UI/UX-Design">UI/UX Design</option>
          <option value="Diploma-in-Computer-software-and-Technology">Diploma in Computer software and Technology</option>
        </select>
      </div>
      <div class="mb-3">
        <select class="form-select" id="class_mode" name="class_mode" required>
          <option value="" disabled selected>Class Mode</option>
          <option value="Online">Online</option>
          <option value="Offline">Offline</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>
  </div>
</div>

<!-- Bootstrap 5.2 JS Bundle (with Popper) and jQuery -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>

  // JavaScript to Auto-Click the Form Toggle Button
  window.addEventListener('load', function() {
    const formToggle = document.getElementById('inquiryForm');
    formToggle.click();
  });

  // Fixed small form in the right bottom corner
  $(document).ready(function() {
    const formContainer = $('#inquiryForm');
    const formToggle = $('#formToggle');
    const toggleIcon = $('#toggleIcon');

    // Automatically show the form after 3 seconds on page load
    setTimeout(() => {
      formContainer.show('slide');
    }, 3000);

    // Toggle form display and icon change
    formToggle.on('click', () => {
      formContainer.toggle('slide');

      // Change icon between chat and close
      if (toggleIcon.hasClass('bi-chat-square-text')) {
        toggleIcon.removeClass('bi-chat-square-text').addClass('bi-x-lg');
        toggleIcon.css('transform', 'rotate(180deg)');
      } else {
        toggleIcon.removeClass('bi-x-lg').addClass('bi-chat-square-text');
        toggleIcon.css('transform', 'rotate(0deg)');
      }
    });
  });

  // Google Apps Script form submission
  const scriptURL = '/api/forms/book-demo'
  const form = document.forms['dynamicForm']

  form.addEventListener('submit', e => {
    e.preventDefault()
    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => console.log('Success!', response))
      .catch(error => console.error('Error!', error.message))
  })

</script>

<script src="/common-lead-form.js" defer></script>
</body>
</html>
