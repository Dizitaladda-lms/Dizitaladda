<style>
      *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    body{
        background-color: black;
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
        align-items: center;
          margin: 0;
  animation: skyTransition 5s ease-in-out forwards;
    }
    @keyframes skyTransition {
  0% {
    background-color: #0c1445; /* night */
  }
  50% {
    background-color: #ff5e5e; /* dawn */
  }
  100% {
    background-color: #fbc96e; /* morning */
  }
}

    .landscape{
        position: relative;
        background-color: #100023;
        content: " ";
        z-index: 1000;
        height: 100%;
        width: 100%;
        color: #100023;
    }
    .sun{
        position: absolute;
    border-radius: 50%;
    background-color: #e90101;
    content: " ";
    width: 100px;
    height: 100px;
    left: 50%;
    transform: translateX(-50%);
    top: 0px;
    z-index: 700;
    animation: riseup 5s ease-in-out forwards;
      box-shadow:
    0 0 20px #e90101,
    0 0 40px rgba(233, 1, 1, 0.6),
    0 0 60px rgba(255, 100, 100, 0.4),
    0 0 80px rgba(255, 150, 150, 0.2);
    }
    @keyframes riseup {
        0%{
            top: 0px;
        }
        100%{
            top: -60px;
        }
    }
    .sunOverlay{
               position: absolute;
    background-color: #100023;
    content: " ";
    width: 200px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    top: 0px;
    z-index: 700;
    }
.sunReflection {
    position: absolute;
    top: -30px; /* below the sun */
    left: 50%;
    transform: translateX(-50%) scaleY(-1);
    width: 100px;
    height: 0px;
    background-color: #e90101;
    border-radius: 50%;
    opacity: 0.4;
    filter: blur(6px);
    z-index: 100000;
    animation: reflectionGrow 5s ease-in-out forwards;
}

@keyframes reflectionGrow {
    0% {
        height: 0px;
        opacity: 0;
    }
    100% {
        height: 80px;
        opacity: 0.4;
    }
}
</style>
